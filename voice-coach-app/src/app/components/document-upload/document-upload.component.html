<div class="upload-layout">
  <header class="upload-header">
    <div>
      <p class="eyebrow">Voice Coach Workspace</p>
      <h1>Upload a product document to get started</h1>
      <p class="subtitle">Supported formats: DOCX, PPT/PPTX, PDF</p>
    </div>
    <a routerLink="/practice" class="link-button">Go to practice</a>
  </header>

  <section class="upload-panel">
    <label class="file-picker">
      <input
        type="file"
        accept=".doc,.docx,.ppt,.pptx,.pdf"
        (change)="onFileSelected($event)"
      />
      <span>{{ selectedFile?.name || 'Choose a document' }}</span>
    </label>

    <button
      class="primary"
      [disabled]="!selectedFile || isUploading"
      (click)="uploadDocument()">
      {{ isUploading ? 'Uploading...' : 'Upload & analyze' }}
    </button>

    <p class="meta" *ngIf="documentMeta">
      Loaded <strong>{{ documentMeta.filename }}</strong> ·
      {{ documentMeta.wordCount }} words
    </p>

    <button class="ghost" *ngIf="documentMeta && !journeyActive" (click)="resumeExistingDocument()">
      Resume last session
    </button>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </section>

  <!-- Multi-card journey UI removed: document upload now leads to a dedicated chat page. -->
</div>
